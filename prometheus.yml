global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    monitor: 'wazuh-prometheus'

scrape_configs:
  # Prometheus sendiri
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Ping Exporter untuk ICMP monitoring
  - job_name: 'ping_exporter'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'localhost:9427'   # exporter sendiri
        labels:
          group: 'local'

  # Contoh tambahan target Ping Exporter (opsional)
  - job_name: 'branch_ping'
    metrics_path: /metrics
    static_configs:
      - targets:
          - '10.13.32.10:9427'
          - '10.13.33.10:9427'
        labels:
          group: 'branch'

rule_files: []
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
